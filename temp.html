<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Payment Site | Home</title>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap");
		</style>
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						backgroundImage: {
							spiral: "url('assets/spiral.svg')",
						},
						content: {
							ball: "url('assets/boll.svg')",
						},
						colors: {
							primary: "#00040F",
							secondary: "#5CE1E6",
						},
					},
				},
			};
		</script>
	</head>

	<body
		class="bg-primary text-white pb-8 snap-y snap-proximity overflow-x-clip"
	>
		<!-- Header and Navbar -->
		<header
			class="container mx-auto text-white flex items-center justify-between gap-3 p-4"
		>
			<div class="flex items-center">
				<img src="./assets/brand.svg" alt="" />
				<span class="text-xl">Raa<span class="text-secondary">shid</span></span>
			</div>
			<div class="*:ml-4 hover:*:underline underline-offset-8 max-md:hidden">
				<a href="#">Home</a>
				<a href="#">About Us</a>
				<a href="#">Features</a>
				<a href="#">Solution</a>
			</div>
			<svg
				class="md:hidden h-10 w-10 cursor-pointer"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				xmlns="http://www.w3.org/2000/svg"
			>
				<path
					d="M17 16H10"
					stroke="white"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
				<path
					d="M17 12H13"
					stroke="white"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
				<path
					d="M17 8H8"
					stroke="white"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
		</header>

		<!-- Better Deal -->
		<section class="better-deal container mx-auto p-4 my-32">
			<div
				class="wrapper flex lg:*:w-1/2 items-center flex-wrap-reverse lg:flex-nowrap justify-center"
			>
				<div class="md:ml-4">
					<h3 class="text-5xl font-bold mb-4">
						Easily control your billing & invoicing.
					</h3>
					<p class="text-gray-300">
						Elit enim sed massa etiam. Mauris eu adipiscing ultrices ametodio
						aenean neque. Fusce ipsum orci rhoncus aliporttitor integer platea
						placerat.
					</p>
					<button
						class="bg-gradient-to-r from-[#5ce1e6] via-[#5ce1e6] to-[#aef9fc] rounded px-8 py-3 text-black font-bold text-md mt-6 hover:bg-[#5ce1e6] active:bg-[#5ce1e6] focus:outline-none focus:ring focus:ring-[#5ce1e6] hover:bg-transparent"
					>
						Get Started
					</button>
				</div>
				<div class="media-content relative my-24 lg:my-4 p-4">
					<img
						src="./assets/spiral.svg"
						class="select-none h-auto mx-auto aspect-square md:w-[450px] lg:w-[450px] xl:w-[600px] max-md:max-w-[90vw] max-h-[70vh]"
						alt=""
					/>
					<img
						src="./assets/analysis_card.svg"
						class="select-none absolute top-0 right-0 max-sm:right-4 max-sm:top-4 max-md:max-w-[40vw]"
						alt=""
					/>
					<img
						src="./assets/scan_opt.svg"
						class="select-none absolute left-0 max-sm:left-4 top-[45%] -translate-y-1/2 max-md:max-w-[35vw]"
						alt=""
					/>

					<img
						src="./assets/payment_method.svg"
						class="select-none absolute bottom-0 max-sm:bottom-4 translate-y-1/3 left-1/2 -translate-x-1/2 max-md:max-w-[40vw]"
						alt=""
					/>
				</div>
			</div>
		</section>
	</body>
</html>
